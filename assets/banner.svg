<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Pill Gradient -->
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6" />
    </pattern>

    <!-- Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes scanline {
        0% { transform: translateY(-360px); }
        100% { transform: translateY(360px); }
      }
      @keyframes streamData {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      .floating-orb {
        animation: pulseGlow 7s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .cursor {
        animation: cursorBlink 1s infinite;
      }
      .data-stream {
        stroke-dasharray: 20 15;
        animation: streamData 18s linear infinite;
      }
      .terminal-window {
        animation: floatSlow 8s ease-in-out infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" filter="blur(70px)" class="floating-orb" opacity="0.25" />
  <circle cx="1060" cy="280" r="170" fill="#c084fc" filter="blur(80px)" class="floating-orb" opacity="0.28" />
  <circle cx="620" cy="340" r="130" fill="#6366f1" filter="blur(75px)" class="floating-orb" opacity="0.2" />

  <!-- Animated Data Stream Lines (In background behind content) -->
  <g opacity="0.4">
    <path class="data-stream" d="M -50 80 Q 300 20 600 90 T 1250 50" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <path class="data-stream" d="M -50 310 Q 400 340 750 290 T 1250 320" fill="none" stroke="#818cf8" stroke-width="1.5" />
  </g>

  <!-- Left Side: Terminal Visual Feature Card -->
  <g class="terminal-window" transform="translate(60, 48)">
    <!-- Terminal Outer Frame -->
    <rect width="360" height="264" rx="12" fill="#0b1120" stroke="#334155" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <path d="M 0 12 Q 0 0 12 0 L 348 0 Q 360 0 360 12 L 360 36 L 0 36 Z" fill="#1e293b" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="180" y="23" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono-text">terminal@ai-cli ~ $</text>

    <!-- Terminal Content Commands -->
    <g class="mono-text" font-size="12">
      <!-- Line 1 -->
      <text x="20" y="68" fill="#38bdf8" font-weight="bold">$</text>
      <text x="35" y="68" fill="#f1f5f9">aider --model sonnet</text>
      
      <!-- Line 2 -->
      <text x="20" y="94" fill="#64748b">> Read 42 files into AST graph</text>
      
      <!-- Line 3 -->
      <text x="20" y="120" fill="#38bdf8" font-weight="bold">$</text>
      <text x="35" y="120" fill="#f1f5f9">gemini run "debug server.py"</text>
      <text x="20" y="146" fill="#10b981">✓ Shell command executed</text>

      <!-- Line 4 -->
      <text x="20" y="172" fill="#38bdf8" font-weight="bold">$</text>
      <text x="35" y="172" fill="#f1f5f9">ollama run deepseek-r1</text>
      <text x="20" y="198" fill="#a855f7">⠋ Synthesizing bash script...</text>

      <!-- Active Cursor Prompt -->
      <text x="20" y="228" fill="#38bdf8" font-weight="bold">$</text>
      <text x="35" y="228" fill="#cbd5e1">open-interpreter --local</text>
      <rect x="238" y="215" width="8" height="15" fill="#38bdf8" class="cursor" />
    </g>
  </g>

  <!-- Right Side: Main Foreground Title & Core Description (Clear & High Contrast) -->
  <g transform="translate(470, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="265" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="15" r="4.5" fill="#10b981" />
      <text x="30" y="20" fill="#38bdf8" font-size="12.5" font-weight="700" class="mono-text">CURATED REPO • 2026 EDITION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="url(#primary-grad)" font-size="44" class="title-text">Awesome AI CLI Tools</text>

    <!-- Subtitle (Clear in Foreground) -->
    <text x="0" y="172" fill="#f8fafc" font-size="20" font-weight="600" class="title-text">Terminal AI Agents • Shell Assistants • Local LLMs</text>

    <!-- Description -->
    <text x="0" y="208" fill="#94a3b8" font-size="14.5" class="title-text">
      The authoritative guide to command-line pair programmers, autonomous coding agents,
    </text>
    <text x="0" y="232" fill="#94a3b8" font-size="14.5" class="title-text">
      and terminal productivity enhancers across SaaS platforms &amp; open-source ecosystems.
    </text>

    <!-- Feature Tags Pill Row -->
    <g transform="translate(0, 264)" class="mono-text" font-size="11.5">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="112" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="56" y="17" fill="#cbd5e1" text-anchor="middle">⚡ MCP Agents</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(122, 0)">
        <rect width="128" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="64" y="17" fill="#cbd5e1" text-anchor="middle">🔒 Local LLMs</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(260, 0)">
        <rect width="142" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="71" y="17" fill="#cbd5e1" text-anchor="middle">💻 Shell Automation</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(412, 0)">
        <rect width="138" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="69" y="17" fill="#cbd5e1" text-anchor="middle">🚀 Git-Native Pair</text>
      </g>
    </g>
  </g>

  <!-- Subtle Bottom Border Accent Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#primary-grad)" rx="2" />
</svg>
